[project]
name = "jobzoeker"
version = "0.1.0"
description = "Dagelijkse vacature-screening voor Nina"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "feedparser>=6.0",
    "pyyaml>=6.0",
    "python-dateutil>=2.9",
]

[project.scripts]
jobzoeker = "jobzoeker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobzoeker"]

[tool.ruff]
line-length = 110
