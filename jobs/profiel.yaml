naam: Nina
opleiding:
  - Master Kunstwetenschappen (major podiumkunsten), UGent
  - Master Vergelijkende Moderne Letterkunde, UGent
ervaring:
  - Productiemedewerker De Grote Post (Oostende), aug 2026 - dec 2026, tijdelijk (residentiewerking + zaalverhuur)
huidige_job:
  functie: Productiemedewerker
  organisatie: De Grote Post (Oostende)
  sinds: 2026-08
  contract: tijdelijk tot 2026-12-31 (verlenging mogelijk)
  barema: PC 304 podiumkunsten, loongroep C+ (zie BAREMAS.md)
  waarom_weg: job was minder dan gehoopt, enkel mails; te weinig afwisseling/praktisch
woonplaats: Gent
wat_ze_zoekt: >
  Breed in de culturele sector: productie (ook op de vloer), events en festivals, zaal/publiek, communicatie,
  redactie en projectwerk, allemaal gelijkwaardig. Bureauwerk is ok, zolang het niet enkel mails is.
  Starter/junior; vacatures die 3+ jaar ervaring vragen mogen, met lagere score.
  Niet: technische functies (licht, geluid, podiumtechniek: daar kent ze niets van), stages (ook BIS),
  pure contentcreatie (video/design/foto als kern), puur administratief/boekhouding, onbetaald werk.

scoring:
  drempel_relevant: 35      # onder deze heuristische score: bewaard, maar niet getoond
  drempel_review: 45        # vanaf hier beoordeelt Claude de vacature inhoudelijk

